# Litematica Agent - deutsche Texte
#
# Farbcodes mit & (&7 grau, &b hellblau, &a grün, &8 dunkelgrau, &l fett, &r zurücksetzen).
# %s wird durch einen Wert ersetzt, %% zeigt ein Prozentzeichen. Jeden Text in einer Zeile und in Anführungszeichen lassen.
# Texte ohne Farbcodes werden in Menüs verwendet und übernehmen die Farben des Menüs.
# Fehlende Schlüssel fallen auf den eingebauten Text zurück.
# Sprache im Spiel ändern mit /agent language <name>. Für eine neue Sprache diese Datei nach message_<name>.yml kopieren.

