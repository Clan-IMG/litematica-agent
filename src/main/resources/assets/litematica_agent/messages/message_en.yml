# Litematica Agent - English texts
#
# Colour codes use & (&7 grey, &b aqua, &a green, &8 dark grey, &l bold, &r reset).
# %s is replaced by a value, %% shows a percent sign. Keep every text on one line and in quotes.
# Texts without colour codes are used in menus and take the colours of the menu.
# Keys missing in this file fall back to the built-in text.
# Change the language in game with /agent language <name>. For a new language copy this file to message_<name>.yml.

format:
  prefix: "&8[&b&lAgent&8] "
  button: "&a&l[%s]"

