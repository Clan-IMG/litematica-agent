plugins {
    id 'fabric-loom' version '1.17.21'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    runs {
        configureEach {
            // A real schematic of tens of millions of blocks needs more: ./gradlew runClientGameTest -PagentTestHeap=12G
            vmArgs "-Xmx" + (providers.gradleProperty('agentTestHeap').orNull ?: '4G')
            // The client game tests' network synchronizer sporadically aborts long agent runs ("interfacing with
            // packets at a lower level"); the tests poll the world state themselves and do not need lockstep ticks.
            property "fabric.client.gametest.disableNetworkSynchronizer", "true"
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "litematica_agent_gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Fallen-Breath"
                url = "https://maven.fallenbreath.me/releases"
            }
        }
        filter {
            includeGroup "me.fallenbreath"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "maven.modrinth:litematica:${project.litematica_version}"
    modImplementation "maven.modrinth:malilib:${project.malilib_version}"
    // Litematica and MaLiLib ship this library as a nested jar, which is not unpacked in the development environment.
    modLocalRuntime "me.fallenbreath:conditional-mixin-fabric:${project.conditional_mixin_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

test {
    useJUnitPlatform()
}

// Select one client scenario without editing the checked-in entrypoints, e.g.
// ./gradlew runClientGameTest -PagentGameTest=WarehouseGameTest
tasks.named('processGametestResources') {
    inputs.property('agentGameTest', providers.gradleProperty('agentGameTest').orElse('all'))
    doLast {
        def selected = providers.gradleProperty('agentGameTest').orNull
        if (selected != null) {
            def manifest = file("${destinationDir}/fabric.mod.json")
            def data = new groovy.json.JsonSlurper().parse(manifest)
            def tests = data.entrypoints['fabric-client-gametest'].findAll {
                it.tokenize('.').last() in selected.split(',').collect { name -> name.trim() }
            }
            if (tests.isEmpty()) throw new GradleException("Unknown agentGameTest: ${selected}")
            data.entrypoints['fabric-client-gametest'] = tests
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        }
    }
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
